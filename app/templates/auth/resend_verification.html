{% extends 'base.html' %}

{% block content %}
<div class="quiz-container">
  <div class="auth-container" style="max-width: 440px; margin: 4rem auto;">
    <div class="card shadow-sm" style="border-radius: 12px;">
      <div class="card-body p-4">
        <h2 class="text-center mb-2" style="font-weight: 700; color: #4f46e5;">
          <i class="fas fa-envelope-open-text"></i> Resend Verification
        </h2>
        <p class="text-center text-muted mb-4" style="font-size: 0.95rem;">
          Enter your registered email address to receive a fresh account activation link.
        </p>

        <form method="POST" action="{{ url_for('auth.resend_verification') }}">
          <div class="form-group mb-3">
            <label for="email" class="form-label" style="font-weight: 600;">Email Address</label>
            <input type="email" name="email" id="email" class="form-control form-control-lg" 
                   placeholder="Enter your registered email" value="{{ email or '' }}" required autofocus>
          </div>

          <div class="alert alert-info py-2" style="font-size: 0.85rem;">
            <i class="fas fa-info-circle"></i> Verification links are valid for 24 hours. Check your spam folder too.
          </div>

          <div class="form-group mt-3">
            <button type="submit" class="btn btn-primary btn-block w-100 btn-lg" style="font-weight: 600;">
              <i class="fas fa-paper-plane"></i> Send Verification Link
            </button>
          </div>
        </form>

        <hr style="margin: 1.5rem 0;">
        <div class="text-center">
          <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary btn-sm mx-1">
            <i class="fas fa-arrow-left"></i> Back to Login
          </a>
          <a href="{{ url_for('auth.register') }}" class="btn btn-outline-primary btn-sm mx-1">
            <i class="fas fa-user-plus"></i> Create Account
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
