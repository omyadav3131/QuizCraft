<!-- FILE: app\templates\admin\change_password.html -->
<!-- PURPOSE: Admin change user password form -->

{% extends 'base.html' %}
{% block content %}
<div class="admin-container">
  <div class="admin-wrapper">
    <div class="admin-header">
      <h1><i class="fas fa-key"></i> Change Password</h1>
      <p>Change password for user: <strong>{{ user.username }}</strong></p>
    </div>

    <div class="form-card">
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control form-control-lg" value="{{ user.username }}" disabled>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control form-control-lg" value="{{ user.email or 'N/A' }}" disabled>
        </div>

        <div class="mb-3">
          <label class="form-label">New Password *</label>
          <input type="password" name="new_password" class="form-control form-control-lg" placeholder="Enter new password" required minlength="6">
          <small class="form-text text-muted">Password must be at least 6 characters long</small>
        </div>

        <div class="mb-3">
          <label class="form-label">Confirm New Password *</label>
          <input type="password" name="confirm_password" class="form-control form-control-lg" placeholder="Confirm new password" required minlength="6">
        </div>

        <div class="form-actions">
          <button class="btn btn-warning btn-lg" type="submit">
            <i class="fas fa-key"></i> Change Password
          </button>
          <a class="btn btn-secondary btn-lg" href="{{ url_for('admin.users') }}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
