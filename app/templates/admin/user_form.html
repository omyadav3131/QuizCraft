<!-- FILE: app\templates\admin\user_form.html -->
<!-- PURPOSE: Brief description of this template and common edit points. -->

{% extends 'base.html' %}
{% block content %}
<div class="admin-container">
  <div class="admin-wrapper">
    <div class="admin-header">
      <h1>{% if user %}<i class="fas fa-edit"></i> Edit User{% else %}<i class="fas fa-user-plus"></i> New User{% endif %}</h1>
      <p>{% if user %}Update user details{% else %}Create a new user account{% endif %}</p>
    </div>

    <div class="form-card">
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Username *</label>
          <input type="text" id="username" name="username" class="form-control form-control-lg" placeholder="Username" required value="{{ user.username if user else '' }}">
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="email" name="email" class="form-control form-control-lg" placeholder="Email (optional)" value="{{ user.email if user else '' }}">
        </div>

        <div class="mb-3">
          <label class="form-label">Password {% if not user %}*{% endif %}</label>
          <input type="password" name="password" class="form-control form-control-lg" {% if not user %}required{% endif %} placeholder="Leave blank to keep current password">
        </div>

        <div class="mb-3">
          <label class="form-label">Role</label>
          <select name="role" id="role" class="form-select form-select-lg" aria-label="User role" title="User role">
            <option value="user" {% if not user or user.role=='user' %}selected{% endif %}>User</option>
            <option value="admin" {% if user and user.role=='admin' %}selected{% endif %}>Admin</option>
          </select>
        </div>

        <div class="form-actions">
          <button class="btn btn-success btn-lg" type="submit">Save</button>
          <a class="btn btn-secondary btn-lg" href="{{ url_for('admin.users') }}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
