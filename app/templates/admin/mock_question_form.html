{% extends 'base.html' %}

{% block content %}
<div class="container py-4" style="max-width: 800px;">
    <div class="card shadow-sm border-0" style="border-radius: 12px;">
        <div class="card-header bg-white border-0 pt-4 px-4 pb-0">
            <div class="text-muted small mb-1">
                {{ section.test.company_name }} / {{ section.test.title }} / {{ section.name }}
            </div>
            <h2 class="h4 font-weight-bold text-dark mb-1">
                {% if question %}Edit Question{% else %}Add Question to {{ section.name }}{% endif %}
            </h2>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                <div class="form-group">
                    <label for="text" class="font-weight-bold">Question Text <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="text" name="text" rows="3"
                              placeholder="Enter the full question statement..." required>{{ question.text if question else '' }}</textarea>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="option1" class="font-weight-bold">Option 1 (A) <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="option1" name="option1"
                               value="{{ question.option1 if question else '' }}" required>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="option2" class="font-weight-bold">Option 2 (B) <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="option2" name="option2"
                               value="{{ question.option2 if question else '' }}" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="option3" class="font-weight-bold">Option 3 (C)</label>
                        <input type="text" class="form-control" id="option3" name="option3"
                               value="{{ question.option3 if question else '' }}">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="option4" class="font-weight-bold">Option 4 (D)</label>
                        <input type="text" class="form-control" id="option4" name="option4"
                               value="{{ question.option4 if question else '' }}">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="correct_option" class="font-weight-bold">Correct Option <span class="text-danger">*</span></label>
                        <select class="form-control" id="correct_option" name="correct_option" required>
                            <option value="1" {% if question and question.correct_option == 1 %}selected{% endif %}>Option 1 (A)</option>
                            <option value="2" {% if question and question.correct_option == 2 %}selected{% endif %}>Option 2 (B)</option>
                            <option value="3" {% if question and question.correct_option == 3 %}selected{% endif %}>Option 3 (C)</option>
                            <option value="4" {% if question and question.correct_option == 4 %}selected{% endif %}>Option 4 (D)</option>
                        </select>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="marks" class="font-weight-bold">Marks</label>
                        <input type="number" class="form-control" id="marks" name="marks" min="1" max="10"
                               value="{{ question.marks if question else 1 }}">
                        <small class="form-text text-muted">No negative marking will apply if wrong.</small>
                    </div>
                </div>

                <div class="form-group">
                    <label for="explanation" class="font-weight-bold">Solution Explanation (Optional)</label>
                    <textarea class="form-control" id="explanation" name="explanation" rows="2"
                              placeholder="Step-by-step reasoning or formula displayed on the result page.">{{ question.explanation if question else '' }}</textarea>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a href="{{ url_for('admin.mock_questions_list', section_id=section.id) }}" class="btn btn-outline-secondary">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="fas fa-save mr-1"></i> {% if question %}Save Changes{% else %}Add Question{% endif %}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
