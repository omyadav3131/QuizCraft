<!-- FILE: app\templates\admin\question_form.html -->
<!-- PURPOSE: Brief description of this template and common edit points. -->

{% extends 'base.html' %}
{% block content %}
<div class="admin-container">
  <div class="admin-wrapper">
    <div class="admin-header">
      <h1>
        {% if question %}
          <i class="fas fa-edit"></i> Edit Question
        {% else %}
          <i class="fas fa-plus"></i> Add New Question
        {% endif %}
      </h1>
      <p>{% if question %}Update an existing question{% else %}Create a new quiz question{% endif %}</p>
    </div>

    <form method="post" class="question-form">
      <div class="form-card">
        <div class="form-section">
          <label class="form-label"><i class="fas fa-question-circle"></i> Question Text *</label>
          <textarea name="text" class="form-control form-control-lg" rows="3" placeholder="Enter the question text" required>{{ question.text if question else '' }}</textarea>
          <small class="form-text text-muted">Be clear and concise in your question</small>
        </div>

        <div class="form-row">
          <div class="form-col">
            <label class="form-label"><i class="fas fa-a"></i> Option 1 *</label>
            <input name="option1" class="form-control form-control-lg" placeholder="First option" value="{{ question.option1 if question else '' }}" required>
          </div>
          <div class="form-col">
            <label class="form-label"><i class="fas fa-b"></i> Option 2 *</label>
            <input name="option2" class="form-control form-control-lg" placeholder="Second option" value="{{ question.option2 if question else '' }}" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-col">
            <label class="form-label"><i class="fas fa-c"></i> Option 3</label>
            <input name="option3" class="form-control form-control-lg" placeholder="Third option (optional)" value="{{ question.option3 if question else '' }}">
          </div>
          <div class="form-col">
            <label class="form-label"><i class="fas fa-d"></i> Option 4</label>
            <input name="option4" class="form-control form-control-lg" placeholder="Fourth option (optional)" value="{{ question.option4 if question else '' }}">
          </div>
        </div>

        <div class="form-row">
          <div class="form-col">
            <label class="form-label"><i class="fas fa-check-circle"></i> Correct Option *</label>
            <select name="correct_option" class="form-select form-select-lg" aria-label="Correct option" title="Correct option" required>
              <option value="">-- Select correct option --</option>
              <option value="1" {% if question and question.correct_option==1 %}selected{% endif %}>Option 1</option>
              <option value="2" {% if question and question.correct_option==2 %}selected{% endif %}>Option 2</option>
              <option value="3" {% if question and question.correct_option==3 %}selected{% endif %}>Option 3</option>
              <option value="4" {% if question and question.correct_option==4 %}selected{% endif %}>Option 4</option>
            </select>
          </div>
          <div class="form-col">
            <label class="form-label"><i class="fas fa-layer-group"></i> Category *</label>
            <select name="category" class="form-select form-select-lg" aria-label="Category" title="Category" required>
              <option value="">-- Select category --</option>
              {% for c in categories %}
                <option value="{{ c.id }}" {% if question and question.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-col">
            <label class="form-label"><i class="fas fa-tasks"></i> Difficulty *</label>
            <select name="difficulty" class="form-select form-select-lg" aria-label="Difficulty" title="Difficulty" required>
              <option value="">-- Select difficulty --</option>
              <option value="Easy" {% if question and question.difficulty=='Easy' %}selected{% endif %}>
                <span class="badge badge-success">Easy</span>
              </option>
              <option value="Medium" {% if question and question.difficulty=='Medium' %}selected{% endif %}>
                <span class="badge badge-warning">Medium</span>
              </option>
              <option value="Hard" {% if question and question.difficulty=='Hard' %}selected{% endif %}>
                <span class="badge badge-danger">Hard</span>
              </option>
            </select>
          </div>
          <div class="form-col">
            <label class="form-label"><i class="fas fa-lightbulb"></i> Explanation</label>
            <textarea name="explanation" class="form-control form-control-lg" rows="2" placeholder="Explanation for the answer (optional)">{{ question.explanation if question else '' }}</textarea>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn btn-success btn-lg" type="submit">
          <i class="fas fa-save"></i> {% if question %}Update Question{% else %}Save Question{% endif %}
        </button>
        <a class="btn btn-secondary btn-lg" href="{{ url_for('admin.index') }}">
          <i class="fas fa-times"></i> Cancel
        </a>
      </div>
    </form>
  </div>
</div>

<style>
.question-form {
  max-width: 800px;
}

.form-card {
  background-color: white;
  border-radius: 8px;
  padding: 2rem;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  margin-bottom: 2rem;
}

.form-section {
  margin-bottom: 2rem;
}

.form-section:last-child {
  margin-bottom: 0;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
  margin-bottom: 1.5rem;
}

.form-row:last-child {
  margin-bottom: 0;
}

.form-col {
  display: flex;
  flex-direction: column;
}

.form-label {
  font-weight: 600;
  margin-bottom: 0.5rem;
  color: #333;
  font-size: 0.95rem;
}

.form-label i {
  margin-right: 0.5rem;
  color: #0d6efd;
}

.form-control-lg,
.form-select-lg {
  padding: 0.75rem 1rem;
  font-size: 1rem;
}

.form-actions {
  display: flex;
  gap: 1rem;
  justify-content: center;
}

.btn-lg {
  padding: 0.75rem 2rem;
  font-weight: 600;
}

@media (max-width: 576px) {
  .form-row {
    grid-template-columns: 1fr;
  }
  
  .form-card {
    padding: 1rem;
  }
  
  .form-actions {
    flex-direction: column;
  }
  
  .btn-lg {
    width: 100%;
  }
}
</style>
{% endblock %}
