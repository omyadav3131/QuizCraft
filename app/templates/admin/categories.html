{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Categories</h3>
  <div>
    <a class="btn btn-outline-info" href="{{ url_for('admin.users') }}">View Users</a>
    <a class="btn btn-outline-secondary" href="{{ url_for('admin.index') }}">Back to Questions</a>
  </div>
</div>
<form method="post" class="row g-2">
  <div class="col-auto"><input name="name" class="form-control" placeholder="New category"></div>
  <div class="col-auto"><button class="btn btn-primary" type="submit">Add</button></div>
</form>
<ul class="list-group mt-3">
  {% for c in categories %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      {{ c.name }}
    </li>
  {% endfor %}
</ul>
{% endblock %}
