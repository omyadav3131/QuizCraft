{% extends 'base.html' %}

{% block content %}
<div class="home-container">
  <div class="home-content">
    <h1><i class="fas fa-graduation-cap"></i> Quiz Master</h1>
    <p>Test your knowledge across multiple categories and difficulty levels. Learn, practice, and excel!</p>
    
    <div class="home-buttons">
      {% if not current_user.is_authenticated %}
        <a class="btn btn-primary" href="{{ url_for('auth.register') }}">
          <i class="fas fa-user-plus"></i> Get Started
        </a>
        <a class="btn btn-secondary" href="{{ url_for('auth.login') }}">
          <i class="fas fa-sign-in-alt"></i> Login
        </a>
      {% else %}
        <a class="btn btn-primary" href="{{ url_for('quiz.select') }}">
          <i class="fas fa-play-circle"></i> Start Quiz
        </a>
        <a class="btn btn-secondary" href="{{ url_for('home') }}">
          <i class="fas fa-home"></i> Home
        </a>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
