{% extends 'base.html' %}

{% block content %}
<div class="text-center py-5">
  <h1 class="display-5 accent">Flask Quiz Application</h1>
  <p class="lead">Automated MCQ quizzes with categories, difficulties, per-question feedback and leaderboard.</p>
  {% if not current_user.is_authenticated %}
    <a class="btn btn-primary" href="{{ url_for('auth.register') }}">Get Started</a>
    <a class="btn btn-outline-primary" href="{{ url_for('auth.login') }}">Login</a>
  {% else %}
    <a class="btn btn-primary" href="{{ url_for('quiz.select') }}">Take a Quiz</a>
  {% endif %}
</div>
{% endblock %}
