{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg">
                <div class="card-header" style="background-color: #0d6efd; color: white;">
                    <h4 class="mb-0">➕ Create New Competition Test</h4>
                </div>
                <div class="card-body p-5">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="category_id" class="form-label">📚 Category</label>
                            <select class="form-select" id="category_id" name="category_id" required>
                                <option value="">Select Category</option>
                                {% for cat in categories %}
                                <option value="{{ cat.id }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="difficulty" class="form-label">⚡ Difficulty Level</label>
                            <select class="form-select" id="difficulty" name="difficulty" required>
                                <option value="">Select Difficulty</option>
                                <option value="Easy">Easy</option>
                                <option value="Medium">Medium</option>
                                <option value="Hard">Hard</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="num_questions" class="form-label">❓ Number of Questions</label>
                            <input type="number" class="form-control" id="num_questions" name="num_questions" value="10" min="5" max="20" required>
                            <small class="form-text text-muted">5-20 questions</small>
                        </div>
                        
                        <div class="mb-3">
                            <label for="time_limit" class="form-label">⏱️ Time Limit (seconds)</label>
                            <input type="number" class="form-control" id="time_limit" name="time_limit" value="600" min="120" required>
                            <small class="form-text text-muted">Minimum 2 minutes (120 seconds)</small>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success btn-lg flex-grow-1">Create Competition</button>
                            <a href="{{ url_for('competition.competition_menu') }}" class="btn btn-secondary btn-lg">Back</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
