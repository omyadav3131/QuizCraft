{% extends 'base.html' %}
{% block content %}
<div class="container mt-5 text-center">
  <div class="card">
    <div class="card-body">
      <h2 class="card-title">Quiz Completed!</h2>
      <h1 class="display-1 text-primary">{{ score }}/{{ total }}</h1>
      <p class="lead">Your Score: {{ ((score / total * 100) if total > 0 else 0) | round(1) }}%</p>
      <div class="mt-4">
        <a href="{{ url_for('quiz.select') }}" class="btn btn-primary">Take Another Quiz</a>
        <a href="{{ url_for('home') }}" class="btn btn-secondary">Go Home</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
