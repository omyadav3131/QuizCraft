{% extends 'base.html' %}

{% block content %}
<div class="quiz-container">
  <div class="card card--max700">
    <div class="card-header">
      <div class="question-number">
        Question {{ question_num }} of {{ total }}
      </div>
      <div class="question-progress">
        <style>
          /* dynamic progress width set per page to avoid inline style attr */
          .question-progress-bar { width: {{ (question_num / total * 100) }}%; }
        </style>
        <div class="question-progress-bar"></div>
      </div>
    </div>
    
    <div class="card-body">
      <h4 class="card-title">{{ question.text }}</h4>
      
      <form method="post">
        <div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="option" id="option1" value="1" required>
            <label class="form-check-label" for="option1">
              <span class="option-number">A.</span> {{ question.option1 }}
            </label>
          </div>
          
          <div class="form-check">
            <input class="form-check-input" type="radio" name="option" id="option2" value="2" required>
            <label class="form-check-label" for="option2">
              <span class="option-number">B.</span> {{ question.option2 }}
            </label>
          </div>
          
          {% if question.option3 %}
          <div class="form-check">
            <input class="form-check-input" type="radio" name="option" id="option3" value="3" required>
            <label class="form-check-label" for="option3">
              <span class="option-number">C.</span> {{ question.option3 }}
            </label>
          </div>
          {% endif %}
          
          {% if question.option4 %}
          <div class="form-check">
            <input class="form-check-input" type="radio" name="option" id="option4" value="4" required>
            <label class="form-check-label" for="option4">
              <span class="option-number">D.</span> {{ question.option4 }}
            </label>
          </div>
          {% endif %}
        </div>
        
        <div class="actions-flex">
          <button type="submit" class="btn btn-primary btn-flex">
            {% if question_num < total %}
              <i class="fas fa-arrow-right"></i> Next Question
            {% else %}
              <i class="fas fa-check-circle"></i> Finish Quiz
            {% endif %}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
