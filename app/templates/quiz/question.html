{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
  <div class="card">
    <div class="card-header">
      <h5>Question {{ question_num }} of {{ total }}</h5>
    </div>
    <div class="card-body">
      <h4 class="card-title">{{ question.text }}</h4>
      <form method="post">
        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="option" id="option1" value="1" required>
          <label class="form-check-label" for="option1">{{ question.option1 }}</label>
        </div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="option" id="option2" value="2" required>
          <label class="form-check-label" for="option2">{{ question.option2 }}</label>
        </div>
        {% if question.option3 %}
        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="option" id="option3" value="3" required>
          <label class="form-check-label" for="option3">{{ question.option3 }}</label>
        </div>
        {% endif %}
        {% if question.option4 %}
        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="option" id="option4" value="4" required>
          <label class="form-check-label" for="option4">{{ question.option4 }}</label>
        </div>
        {% endif %}
        <button type="submit" class="btn btn-primary mt-3">
          {% if question_num < total %}Next Question{% else %}Finish Quiz{% endif %}
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
